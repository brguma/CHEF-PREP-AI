<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1D3557">
  <title>ChefPrep — Gestão da Cozinha</title>
  <style>
    html,body{margin:0;min-height:100%;background:#FAF7F0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center;color:#2B2A26;padding:24px;text-align:center}
    #boot b{display:block;margin-bottom:8px}
  </style>
</head>
<body>
  <div id="boot"><div><b>ChefPrep</b>Carregando sua cozinha…</div></div>
  <script>
  (async () => {
    try {
      const resp = await fetch('./legacy.html', { cache: 'no-cache' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      let html = await resp.text();
      const patch = '<script src="./core-fixes.js?v=1.11.1"><\\/script>';
      if (!html.includes('</body>')) throw new Error('baseline inválido');
      html = html.replace('</body>', patch + '</body>');
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      console.error('ChefPrep bootstrap:', e);
      document.getElementById('boot').innerHTML = '<div><b>Não foi possível abrir o ChefPrep</b>Recarregue quando houver conexão. Se o app já foi instalado, o modo offline volta a funcionar após a atualização do cache.</div>';
    }
  })();
  </script>
</body>
</html>
