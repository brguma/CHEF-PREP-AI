name: Apply ChefPrep red-team fixes

on:
  push:
    branches:
      - fix/core-reliability-2026-09
    paths:
      - .github/workflows/redteam-core-fix.yml
      - .github/scripts/redteam_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-09
          fetch-depth: 0
      - name: Apply integration fixes and regression coverage
        run: python .github/scripts/redteam_patch.py
      - name: Remove temporary repair files and commit
        run: |
          git rm .github/workflows/redteam-core-fix.yml .github/scripts/redteam_patch.py
          git config user.name "ChefPrep Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: fechar achados de integração do hardening"
          git push origin HEAD:fix/core-reliability-2026-09
