name: Refine ChefPrep list accounting

on:
  push:
    branches:
      - fix/core-reliability-2026-09
    paths:
      - .github/workflows/refine-list-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-09
          fetch-depth: 0
      - name: Refine source-aware list accounting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('core-fixes.js')
          s = p.read_text(encoding='utf-8')
          novo = r'''  addNaLista = function(itens, origem) {
            let n = 0;
            const fonte = origem || 'manual';
            for (const it of itens) {
              const c = resolverVocab(it.nome) || canonico(it.nome);
              const candidatos = S.lista.filter(l =>
                !l.comprado &&
                (resolverVocab(l.nome) || canonico(l.nome)) === c &&
                (it.qtd == null || (l.origem || 'manual') === fonte));

              let jaTem = null;
              let convertido = null;
              if (it.qtd == null) {
                jaTem = candidatos[0] || null;
              } else {
                for (const l of candidatos) {
                  if (l.qtd == null) { jaTem = l; break; }
                  const conv = convParaItem(it.qtd, it.unidade || l.unidade, l.unidade, c);
                  if (conv) { jaTem = l; convertido = conv.v; break; }
                }
              }

              if (jaTem) {
                if (it.qtd != null) {
                  const valor = jaTem.qtd == null
                    ? it.qtd
                    : (convertido == null
                        ? (convParaItem(it.qtd, it.unidade || jaTem.unidade, jaTem.unidade, c) || {}).v
                        : convertido);
                  if (valor != null && (jaTem.qtd == null || Math.abs(valor - jaTem.qtd) > EPS)) {
                    jaTem.qtd = Math.round(valor * 100) / 100;
                    if (!jaTem.unidade) jaTem.unidade = it.unidade || '';
                    DB.salvar('lista', jaTem);
                    n++;
                  }
                }
                continue;
              }

              const novo = {
                id: U.id(), nome: it.nome, qtd: it.qtd == null ? null : it.qtd,
                unidade: it.unidade || '', comprado: false, origem: fonte
              };
              S.lista.push(novo);
              DB.salvar('lista', novo);
              n++;
            }
            return n;
          };

          UI.gerarListaDaSemana'''
          s2, count = re.subn(r"  addNaLista = function\(itens, origem\) \{.*?\n  \};\n\n  UI\.gerarListaDaSemana", novo, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one addNaLista block, got {count}')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/refine-list-fix.yml
          git config user.name "ChefPrep Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: separar demandas independentes na lista de compras"
          git push origin HEAD:fix/core-reliability-2026-09
