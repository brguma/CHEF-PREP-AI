name: ChefPrep browser QA one-shot

on:
  push:
    branches:
      - fix/core-reliability-2026-09
    paths:
      - .github/workflows/browser-qa-one-shot.yml
      - .github/scripts/browser_qa.spec.js

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/chefprep-http.log 2>&1 &
          echo $! > /tmp/chefprep-http.pid
          sleep 2
      - name: Run browser and offline smoke
        run: npx playwright test .github/scripts/browser_qa.spec.js --reporter=line
