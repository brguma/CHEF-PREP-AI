name: Apply ChefPrep core fixes

on:
  push:
    branches:
      - fix/core-reliability-2026-09
    paths:
      - .github/workflows/apply-core-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-09
          fetch-depth: 0

      - name: Apply deterministic core fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def sub_once(pattern, repl, label, flags=re.S):
              global s
              s2, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              s = s2

          # Keep the visible/internal version aligned with this reliability patch.
          s = s.replace('ChefPrep v1.0 — Sistema Inteligente de Gestão da Cozinha Doméstica',
                        'ChefPrep v1.11.1 — Sistema Inteligente de Gestão da Cozinha Doméstica', 1)
          s = s.replace('ChefPrep v1.11.0 · offline-first · 817 receitas',
                        'ChefPrep v1.11.1 · offline-first · 817 receitas', 1)

          # Atomic restore across all IndexedDB stores.
          marker = """  function tx(store, modo, fn) {
            return new Promise((res, rej) => {
              const t = db.transaction(store, modo);
              const r = fn(t.objectStore(store));
              t.oncomplete = () => res(r && r._pronto ? r._resultado : true);
              t.onerror = () => rej(t.error);
              if (r && 'onsuccess' in r) {
                r.onsuccess = () => { r._pronto = true; r._resultado = r.result; };
              }
            });
          }
          return {
            abrir,
            todos: (s) => tx(s, 'readonly', os => os.getAll()),
            pegar: (s, id) => tx(s, 'readonly', os => os.get(id)),
            salvar: (s, obj) => tx(s, 'readwrite', os => os.put(obj)),
            remover: (s, id) => tx(s, 'readwrite', os => os.delete(id)),
            limpar: (s) => tx(s, 'readwrite', os => os.clear())
          };
"""
          replacement = """  function tx(store, modo, fn) {
            return new Promise((res, rej) => {
              const t = db.transaction(store, modo);
              const r = fn(t.objectStore(store));
              t.oncomplete = () => res(r && r._pronto ? r._resultado : true);
              t.onerror = () => rej(t.error);
              if (r && 'onsuccess' in r) {
                r.onsuccess = () => { r._pronto = true; r._resultado = r.result; };
              }
            });
          }
          function substituirTudo(dump, config) {
            return new Promise((res, rej) => {
              const t = db.transaction(STORES, 'readwrite');
              let terminou = false;
              t.oncomplete = () => { terminou = true; res(true); };
              t.onerror = () => { if (!terminou) rej(t.error || new Error('Falha ao restaurar backup')); };
              t.onabort = () => { if (!terminou) rej(t.error || new Error('Restauração cancelada')); };
              try {
                for (const nome of ['receitas', 'estoque', 'plano', 'lista']) {
                  const os = t.objectStore(nome);
                  os.clear();
                  for (const item of dump[nome]) os.put(item);
                }
                const cfg = t.objectStore('config');
                cfg.clear();
                cfg.put(config);
              } catch (e) {
                try { t.abort(); } catch (_) {}
                rej(e);
              }
            });
          }
          return {
            abrir,
            todos: (s) => tx(s, 'readonly', os => os.getAll()),
            pegar: (s, id) => tx(s, 'readonly', os => os.get(id)),
            salvar: (s, obj) => tx(s, 'readwrite', os => os.put(obj)),
            remover: (s, id) => tx(s, 'readwrite', os => os.delete(id)),
            limpar: (s) => tx(s, 'readwrite', os => os.clear()),
            substituirTudo
          };
"""
          if marker not in s:
              raise SystemExit('DB marker not found')
          s = s.replace(marker, replacement, 1)

          # Quantity-aware inventory coverage. convParaItem is a function declaration and is hoisted.
          marker = """function vincularEstoqueAntigo() {
            let n = 0;
            for (const it of S.estoque) {
              if (it.can) continue;
              const v = resolverVocab(it.nome);
              if (v && v !== canonico(it.nome)) { it.can = v; DB.salvar('estoque', it); n++; }
            }
            return n;
          }

          /* --- SuggestionProvider"""
          inserted = """function vincularEstoqueAntigo() {
            let n = 0;
            for (const it of S.estoque) {
              if (it.can) continue;
              const v = resolverVocab(it.nome);
              if (v && v !== canonico(it.nome)) { it.can = v; DB.salvar('estoque', it); n++; }
            }
            return n;
          }

          /* Mede cobertura REAL do estoque para uma necessidade, somando lotes e convertendo unidades.
             status: ok | parcial | sem | incompativel. */
          function coberturaIngrediente(ing, fator = 1, idx = indiceEstoque(), cacheRes = new Map()) {
            const c = canonico(ing.nome);
            const necessario = Math.max(0, (+ing.qtd || 0) * fator);
            if (ehBasico(c)) return { status: 'ok', necessario, disponivel: Infinity, faltante: 0, fracao: 1, itens: [] };
            const k = resolverEstoque(c, idx, cacheRes);
            const itens = ((k && idx[k]) || []).filter(e => +e.qtd > 0);
            if (!itens.length) return { status: 'sem', necessario, disponivel: 0, faltante: necessario, fracao: 0, itens: [] };
            if (U.norm(ing.unidade) === 'a gosto' || necessario <= 0)
              return { status: 'ok', necessario, disponivel: necessario, faltante: 0, fracao: 1, itens };
            let disponivel = 0, convertiveis = 0;
            for (const e of itens) {
              const conv = convParaItem(+e.qtd || 0, e.unidade, ing.unidade, c);
              if (!conv) continue;
              disponivel += conv.v;
              convertiveis++;
            }
            if (!convertiveis)
              return { status: 'incompativel', necessario, disponivel: 0, faltante: necessario, fracao: 0, itens };
            const faltante = Math.max(0, necessario - disponivel);
            const fracao = necessario > 0 ? Math.min(1, disponivel / necessario) : 1;
            return { status: faltante <= 0.01 ? 'ok' : (disponivel > 0 ? 'parcial' : 'sem'),
              necessario, disponivel, faltante, fracao, itens };
          }

          /* --- SuggestionProvider"""
          if marker not in s:
              raise SystemExit('coverage insertion marker not found')
          s = s.replace(marker, inserted, 1)

          new_provider = r'''const SuggestionProvider = {
            nome: 'deterministico-v1.1-quantitativo',
            sugerir({ receitas, opcoes = {} } = {}) {
              const idx = indiceEstoque();
              const cacheRes = new Map();
              const diasAlerta = S.config.diasAlertaValidade;
              const res = [];
              for (const r of receitas) {
                const obrig = r.ingredientes.filter(i => !i.opcional);
                if (!obrig.length) continue;
                const tem = [], faltam = [];
                let usaVencendo = false, faltaCritico = false, coberturaTotal = 0;
                for (const ing of obrig) {
                  const cob = coberturaIngrediente(ing, 1, idx, cacheRes);
                  coberturaTotal += cob.fracao;
                  if (cob.status === 'ok') tem.push(ing);
                  else {
                    faltam.push(Object.assign({}, ing, {
                      parcial: cob.status === 'parcial',
                      qtdFaltante: Math.round(cob.faltante * 100) / 100
                    }));
                    if (ing.critico) faltaCritico = true;
                  }
                  if (cob.itens.some(e => {
                    const d = U.diasAte(e.validade);
                    return d !== null && d >= 0 && d <= diasAlerta;
                  })) usaVencendo = true;
                }
                let score = coberturaTotal / obrig.length;
                if (usaVencendo) score += 0.15;
                if (r.favorito) score += 0.10;
                if (faltaCritico) score -= 0.30;
                let badge = null;
                if (!faltam.length) badge = 'ok';
                else if (faltam.length === 1) badge = 'um';
                else if (coberturaTotal / obrig.length >= 0.7) badge = 'quase';
                res.push({ receita: r, score, tem, faltam, faltaCritico, badge, usaVencendo });
              }
              res.sort((a, b) => b.score - a.score);
              return opcoes.limite ? res.slice(0, opcoes.limite) : res;
            }
          };

          /* --- Motor de Busca'''
          sub_once(r"const SuggestionProvider = \{.*?\n\};\n\n/\* --- Motor de Busca", new_provider, 'SuggestionProvider')

          new_missing = r'''function itensFaltantes(receita, porcoes) {
            const idx = indiceEstoque();
            const cacheRes = new Map();
            const fator = porcoes / receita.porcoesBase;
            const faltam = [];
            for (const ing of receita.ingredientes.filter(i => !i.opcional && !ehBasico(i.nome))) {
              const cob = coberturaIngrediente(ing, fator, idx, cacheRes);
              if (cob.status === 'ok') continue;
              faltam.push({ nome: ing.nome,
                qtd: Math.round(cob.faltante * 100) / 100,
                unidade: ing.unidade,
                parcial: cob.status === 'parcial' });
            }
            return faltam;
          }

          /* Consolida todas as receitas planejadas ANTES de descontar o estoque.
             Evita usar o mesmo estoque duas vezes e evita perder demanda repetida. */
          function itensFaltantesPlano(planos) {
            const demandas = [];
            for (const p of planos) {
              if (p.data && p.data < U.hojeISO()) continue;
              const r = S.receitas.find(x => x.id === p.receitaId);
              if (!r) continue;
              const fator = (p.porcoes || r.porcoesBase) / r.porcoesBase;
              for (const ing of r.ingredientes.filter(i => !i.opcional && !ehBasico(i.nome))) {
                const c = canonico(ing.nome);
                const qtd = (+ing.qtd || 0) * fator;
                let alvo = null, convertido = null;
                for (const d of demandas) {
                  if (d.c !== c) continue;
                  const conv = convParaItem(qtd, ing.unidade, d.unidade, c);
                  if (conv) { alvo = d; convertido = conv.v; break; }
                }
                if (alvo) alvo.qtd += convertido;
                else demandas.push({ c, nome: ing.nome, qtd, unidade: ing.unidade });
              }
            }
            const idx = indiceEstoque(), cacheRes = new Map();
            const faltam = [];
            for (const d of demandas) {
              const k = resolverEstoque(d.c, idx, cacheRes);
              let disponivel = 0;
              for (const e of ((k && idx[k]) || []).filter(x => +x.qtd > 0)) {
                const conv = convParaItem(+e.qtd || 0, e.unidade, d.unidade, d.c);
                if (conv) disponivel += conv.v;
              }
              const falta = Math.max(0, d.qtd - disponivel);
              if (falta > 0.01) faltam.push({ nome: d.nome, qtd: Math.round(falta * 100) / 100, unidade: d.unidade });
            }
            return faltam;
          }

          function addNaLista(itens, origem) {
            let n = 0;
            for (const it of itens) {
              const c = resolverVocab(it.nome) || canonico(it.nome);
              const jaTem = S.lista.find(l => !l.comprado && (resolverVocab(l.nome) || canonico(l.nome)) === c);
              if (jaTem) {
                if (it.qtd != null) {
                  if (jaTem.qtd == null) {
                    jaTem.qtd = it.qtd; jaTem.unidade = it.unidade || jaTem.unidade || '';
                    DB.salvar('lista', jaTem); n++;
                  } else {
                    const conv = convParaItem(it.qtd, it.unidade || jaTem.unidade, jaTem.unidade, c);
                    if (conv && conv.v > jaTem.qtd + 0.01) {
                      jaTem.qtd = Math.round(conv.v * 100) / 100;
                      DB.salvar('lista', jaTem); n++;
                    }
                  }
                }
                continue;
              }
              const novo = { id: U.id(), nome: it.nome, qtd: it.qtd == null ? null : it.qtd,
                             unidade: it.unidade || '', comprado: false, origem: origem || 'manual' };
              S.lista.push(novo); DB.salvar('lista', novo); n++;
            }
            return n;
          }

          /* --- Baixa'''
          sub_once(r"function itensFaltantes\(receita, porcoes\) \{.*?\n\}\nfunction addNaLista\(itens, origem\) \{.*?\n\}\n\n/\* --- Baixa", new_missing, 'faltantes/lista')

          # Recipe detail must not show a partial quantity as fully available.
          old = """      const kEst = resolverEstoque(canonico(i.nome), idx, cacheRes);
                const temEstoque = !!(kEst && idx[kEst].some(e => e.qtd > 0));
                const basico = !temEstoque && ehBasico(i.nome);
                const subDet = (!temEstoque && !basico && !i.opcional) ? acharSubstituto(canonico(i.nome), idx, cacheRes) : null;
                return `<div class=\"ing-linha ${temEstoque || basico || i.opcional ? '' : 'sem'}\">
                  <i class=\"pt ${temEstoque ? 'tem' : basico ? 'bas' : (i.opcional ? 'opc' : 'falta')}\"
                     title=\"${basico ? 'básico da despensa' : ''}\"></i>
                  <span>${U.esc(i.nome)}${i.opcional ? ' <small style=\"color:var(--cinza)\">(opcional)</small>' : basico ? ' <small style=\"color:#5B84C4\">(básico)</small>' : ''}
                    ${subDet ? `<br><small class=\"sub-inline\">💡 troque por ${U.esc(subDet.por)} (${U.esc(subDet.nota)})</small>` : ''}</span>
                  <span class=\"qtd-ing\">${U.fmtQtd(i.qtd * fator)} ${U.esc(i.unidade)}</span></div>`;
"""
          new = """      const basico = ehBasico(i.nome);
                const cob = coberturaIngrediente(i, fator, idx, cacheRes);
                const temEstoque = !basico && cob.status === 'ok';
                const parcial = !basico && cob.status === 'parcial';
                const subDet = (cob.status === 'sem' && !basico && !i.opcional) ? acharSubstituto(canonico(i.nome), idx, cacheRes) : null;
                return `<div class=\"ing-linha ${temEstoque || basico || i.opcional ? '' : 'sem'}\">
                  <i class=\"pt ${temEstoque ? 'tem' : basico ? 'bas' : (i.opcional ? 'opc' : 'falta')}\"
                     title=\"${basico ? 'básico da despensa' : parcial ? 'quantidade insuficiente' : ''}\"></i>
                  <span>${U.esc(i.nome)}${i.opcional ? ' <small style=\"color:var(--cinza)\">(opcional)</small>' : basico ? ' <small style=\"color:#5B84C4\">(básico)</small>' : ''}
                    ${parcial ? `<br><small style=\"color:var(--mostarda)\">estoque parcial — falta ${U.fmtQtd(cob.faltante)} ${U.esc(i.unidade)}</small>` : ''}
                    ${subDet ? `<br><small class=\"sub-inline\">💡 troque por ${U.esc(subDet.por)} (${U.esc(subDet.nota)})</small>` : ''}</span>
                  <span class=\"qtd-ing\">${U.fmtQtd(i.qtd * fator)} ${U.esc(i.unidade)}</span></div>`;
"""
          if old not in s:
              raise SystemExit('recipe detail marker not found')
          s = s.replace(old, new, 1)

          # Show partial missing quantities in suggestion cards.
          s = s.replace("s.faltam.map(i => U.esc(i.nome)).join(', ')",
                        "s.faltam.map(i => U.esc(i.nome) + (i.parcial && i.qtdFaltante > 0 ? ` (faltam ${U.fmtQtd(i.qtdFaltante)} ${U.esc(i.unidade)})` : '')).join(', ')", 1)

          old_week = """  gerarListaDaSemana() {
            let todos = [];
            for (const p of S.plano) {
              if (p.data < U.hojeISO()) continue;
              const r = S.receitas.find(x => x.id === p.receitaId);
              if (r) todos = todos.concat(itensFaltantes(r, p.porcoes));
            }
            if (!todos.length) { UI.toast('Nada faltando — estoque cobre o plano ✓'); return; }
            const n = addNaLista(todos, 'plano semanal');
            UI.toast(`${n} ite${n === 1 ? 'm' : 'ns'} adicionado${n === 1 ? '' : 's'} à lista`);
            UI.ir('lista');
          },
"""
          new_week = """  gerarListaDaSemana() {
            const todos = itensFaltantesPlano(S.plano);
            if (!todos.length) { UI.toast('Nada faltando — estoque cobre o plano ✓'); return; }
            const n = addNaLista(todos, 'plano semanal');
            UI.toast(n ? `${n} ite${n === 1 ? 'm' : 'ns'} incluído${n === 1 ? '' : 's'} ou atualizado${n === 1 ? '' : 's'} na lista`
                       : 'A lista já cobre tudo que falta para o plano');
            UI.ir('lista');
          },
"""
          if old_week not in s:
              raise SystemExit('weekly list marker not found')
          s = s.replace(old_week, new_week, 1)

          # Backup restore becomes atomic and validates core recipe shape before touching current data.
          old_import = r'''        // valida e normaliza ANTES de apagar qualquer coisa (keyPath 'id' é obrigatório no IndexedDB)
                  const dump = {};
                  for (const s of ['receitas', 'estoque', 'plano', 'lista']) {
                    dump[s] = (Array.isArray(d[s]) ? d[s] : [])
                      .filter(it => it && typeof it === 'object')
                      .map(it => (it.id ? it : Object.assign({ id: U.id() }, it)));
                  }
                  if (!confirm('Importar vai substituir todos os dados atuais. Continuar?')) return;
                  for (const s of ['receitas', 'estoque', 'plano', 'lista']) {
                    await DB.limpar(s);
                    for (const item of dump[s]) await DB.salvar(s, item);
                  }
                  if (d.config && typeof d.config === 'object') {
                    d.config.id = 'cfg'; await DB.salvar('config', d.config);
                  }
                  await carregarTudo();'''
          new_import = r'''        // valida e normaliza TUDO antes de abrir a transação destrutiva.
                  const dump = {};
                  for (const nomeStore of ['receitas', 'estoque', 'plano', 'lista']) {
                    dump[nomeStore] = (Array.isArray(d[nomeStore]) ? d[nomeStore] : [])
                      .filter(it => it && typeof it === 'object')
                      .map(it => (it.id ? it : Object.assign({ id: U.id() }, it)));
                  }
                  if (dump.receitas.some(r => !r.nome || !Array.isArray(r.ingredientes) || !Array.isArray(r.passos)))
                    throw new Error('receitas inválidas');
                  if (dump.estoque.some(e => !e.nome || !e.unidade || !Number.isFinite(+e.qtd) || +e.qtd < 0))
                    throw new Error('estoque inválido');
                  const cfg = Object.assign({}, S.config, (d.config && typeof d.config === 'object') ? d.config : {}, { id: 'cfg' });
                  if (!confirm('Importar vai substituir todos os dados atuais. Continuar?')) return;
                  await DB.substituirTudo(dump, cfg);
                  await carregarTudo();'''
          if old_import not in s:
              raise SystemExit('backup import marker not found')
          s = s.replace(old_import, new_import, 1)

          p.write_text(s, encoding='utf-8')

          # Service Worker: align version and never poison the offline cache with an HTTP error.
          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = re.sub(r'/\* v1\.9\.1 — estratégia network-first para o app:', '/* v1.11.1 — estratégia network-first para o app:', w, count=1)
          w = re.sub(r"const CACHE = 'chefprep-v1\.10\.0';", "const CACHE = 'chefprep-v1.11.1';", w, count=1)
          old_fetch = """      fetch(e.request).then(resp => {
                const cp = resp.clone();
                caches.open(CACHE).then(c => c.put(e.request, cp));
                return resp;
              }).catch(() =>
"""
          new_fetch = """      fetch(e.request).then(resp => {
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const cp = resp.clone();
                caches.open(CACHE).then(c => c.put(e.request, cp));
                return resp;
              }).catch(() =>
"""
          if old_fetch not in w:
              raise SystemExit('service-worker fetch marker not found')
          w = w.replace(old_fetch, new_fetch, 1)
          sw.write_text(w, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit fixes
        shell: bash
        run: |
          git config user.name "ChefPrep Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-core-fixes.yml
          git add index.html sw.js
          git commit -m "fix: tornar estoque e lista quantitativos e endurecer persistência"
          git push origin HEAD:fix/core-reliability-2026-09
