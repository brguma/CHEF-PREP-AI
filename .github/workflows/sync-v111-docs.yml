name: Sync ChefPrep v1.11.1 docs

on:
  push:
    branches:
      - fix/core-reliability-2026-09
    paths:
      - .github/workflows/sync-v111-docs.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-09
          fetch-depth: 0
      - name: Align README and current state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('version-1.11.0-orange', 'version-1.11.1-orange', 1)
          s = s.replace('serve `index.html`, `sw.js`, `manifest.webmanifest` and `receitas.json`',
                        'serve `index.html`, `core-fixes.js`, `sw.js`, `manifest.webmanifest` and `receitas.json`', 1)
          s = s.replace('sirva `index.html`, `sw.js`, `manifest.webmanifest` e `receitas.json`',
                        'sirva `index.html`, `core-fixes.js`, `sw.js`, `manifest.webmanifest` e `receitas.json`', 1)
          s = s.replace('- **App shell**: `index.html` (vanilla JS, no framework, no build step)\n',
                        '- **App shell**: `index.html` (vanilla JS, no framework, no build step)\n- **Reliability hardening**: `core-fixes.js` (quantity-aware stock/list accounting + safer backup restore)\n', 1)
          s = s.replace('- **Shell do app**: `index.html` (JavaScript puro, sem framework, sem build)\n',
                        '- **Shell do app**: `index.html` (JavaScript puro, sem framework, sem build)\n- **Hardening de confiabilidade**: `core-fixes.js` (estoque/lista quantitativos + restauração de backup mais segura)\n', 1)
          s = s.replace('**🍽️ "What can I cook right now?"** Suggestions ranked by what\'s in your pantry, prioritizing ingredients about to expire.',
                        '**🍽️ "What can I cook right now?"** Suggestions now require enough quantity — partial stock is reported as a shortage — and still prioritize ingredients about to expire.', 1)
          s = s.replace('**🍽️ "O que dá pra fazer agora?"** Sugestões ordenadas pelo que há na despensa, priorizando ingredientes perto de vencer.',
                        '**🍽️ "O que dá pra fazer agora?"** Sugestões agora exigem quantidade suficiente — estoque parcial aparece como falta — e continuam priorizando ingredientes perto de vencer.', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('.ai/CURRENT_STATE.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('- preservação de demandas com unidades incompatíveis;\n',
                        '- preservação de demandas independentes por origem e de demandas com unidades incompatíveis;\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/sync-v111-docs.yml
          git config user.name "ChefPrep Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: alinhar README ao candidato v1.11.1"
          git push origin HEAD:fix/core-reliability-2026-09
